name: FitBot Daily Video Pipeline

on:
  schedule:
    - cron: "0 9 * * *"   # 9:00 AM UTC daily (9:00 AM Ghana time)
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  post-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
          sudo apt-get install -y fonts-open-sans 2>/dev/null || true
          echo "ffmpeg version:"
          ffmpeg -version | head -1
          echo "Fonts:"
          fc-list | grep -i "liberation\|poppins\|open" | head -5 || echo "Using default fonts"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip -q
          pip install -r video_pipeline/requirements.txt -q
          echo "Installed packages:"
          pip list | grep -i "requests\|edge\|pillow\|cloudinary\|nest"

      - name: Check required secrets
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "ERROR: GROQ_API_KEY missing"
            echo "Get one free at console.groq.com (no credit card needed)"
            exit 1
          fi
          if [ -z "$PEXELS_API_KEY" ]; then
            echo "ERROR: PEXELS_API_KEY missing"
            echo "Get one free at pexels.com/api (no credit card needed)"
            exit 1
          fi
          echo "All required secrets present"

      - name: Run FitBot pipeline
        env:
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          CLOUDINARY_URL:         ${{ secrets.CLOUDINARY_URL }}
          CHANNEL_NAME:           ${{ secrets.CHANNEL_NAME }}
          NICHE:                  ${{ secrets.NICHE }}
          VIDEO_DURATION:         "45"
          TTS_VOICE:              "en-US-GuyNeural"
          TIKTOK_ACCESS_TOKEN:    ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID:   ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID:      ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:  ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:  ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FACEBOOK_PAGE_ID:       ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN:  ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          cd video_pipeline
          python pipeline.py

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_number }}
          path: |
            video_pipeline/pipeline.log
            video_pipeline/run_history.json
          if-no-files-found: warn
          retention-days: 30
